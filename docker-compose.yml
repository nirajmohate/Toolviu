# One-command production-style stack:  cp .env.example .env  &&  docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/toolviu
      # Must match the public URL of the website (see README)
      CORS_ORIGINS: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-2}

  web:
    build:
      context: ./client
      args:
        API_URL: http://api:5000
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-Toolviu}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@example.com}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_TOP: ${ADSENSE_SLOT_TOP:-}
        NEXT_PUBLIC_ADSENSE_SLOT_BOTTOM: ${ADSENSE_SLOT_BOTTOM:-}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:5000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
